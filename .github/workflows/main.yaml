name: Continuous integration

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message || '', '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - run: python3 -m pip install '--only-binary=:all:' --requirement=.github/requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - id: success
        run: echo "::set-output name=success::true"

  test:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message || '', '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - run: python3 -m pip install '--only-binary=:all:' --requirement=.github/requirements.txt

      - name: Print environment information
        run: c2cciutils-env

      - name: Settings documentation
        run: make settings-doc
      # Fail if there is something to commit
      - run: git diff --exit-code --color
      - run: git diff --patch > /tmp/settings-doc.patch; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update settings documentation.patch
          path: /tmp/settings-doc.patch
          retention-days: 1
        if: failure()

      - name: Checks
        run: make prospector

      - name: Tests
        run: make pytest

      - name: Build
        run: docker build --tag=c2casgiutils .

      - name: Checks FastAPI app
        run: make acceptance_prospector

      - name: Test FastAPI app
        run: make acceptance_pytest

      - name: Checks scaffold
        run: make scaffold_build

      - run: c2cciutils-docker-logs
        if: always()

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Acceptance-tests
          path: acceptance_tests/fastapi_app/results
          retention-days: 1
        if: failure()

      - id: success
        run: echo "::set-output name=success::true"

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: [pre-commit, test]
    if: always()

    permissions:
      contents: read
      id-token: write

    steps:
      - run: '[[ "${{ needs.pre-commit.outputs.success }}" == "true" ]]'
      - run: '[[ "${{ needs.test.outputs.success }}" == "true" ]]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=.github/requirements.txt

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          cache-python: true
          python-version: '3.11'

      # tag-publish connects itself to PyPI with OpenId Connect, and only when the context publishes.
      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
